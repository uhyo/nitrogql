"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard.
"""
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/andimarek/date-time")

"A calendar date without time, such as 2024-05-01."
scalar Date

"An object with a globally unique ID."
interface Node {
  id: ID!
}

"Information about pagination in a connection."
type PageInfo {
  "Whether there are more items after the last one."
  hasNextPage: Boolean! @model
  "Cursor of the last item in the page."
  endCursor: String @model
}

enum SortDirection {
  ASC
  DESC
}
