# Used by the TypeScript content mapper (types of .graphql files),
# the webpack loader and `nitrogql check`.
schema: ./src/schema/*.graphql
documents:
  - ./src/app/**/*.graphql
  - ./src/components/**/*.graphql
extensions:
  nitrogql:
    plugins:
      - "nitrogql:model-plugin"
    generate:
      type:
        scalarTypes:
          ID: string
          DateTime: string
          Date: string
