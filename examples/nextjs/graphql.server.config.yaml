# Used by `nitrogql generate` to generate types and schema for the GraphQL server.
# Operation types are provided by the TypeScript content mapper (see graphql.config.yaml),
# so this config has no documents.
schema: ./src/schema/*.graphql
extensions:
  nitrogql:
    plugins:
      - "nitrogql:model-plugin"
    generate:
      schemaOutput: ./src/generated/schema.d.ts
      serverGraphqlOutput: ./src/generated/graphql.ts
      resolversOutput: ./src/generated/resolvers.d.ts
      schemaModuleSpecifier: "@/generated/schema"
      type:
        scalarTypes:
          ID: string
          DateTime: string
          Date: string
