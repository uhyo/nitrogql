name: Publish
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm OIDC Trusted Publishing
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: install rustup
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - uses: Swatinem/rust-cache@v2
      - name: install additional targets
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: install wasm-opt
        run: npm install wasm-opt -g
      - name: install wasm-snip
        run: cargo install wasm-snip
      - name: build rust
        run: ./build/build-rust.sh
        env:
          OPTIMIZE: "1"
      - name: build node
        run: ./build/build-node.sh
        env:
          OPTIMIZE: "1"
      - name: update npm
        # npm >= 11.5.1 is required for OIDC Trusted Publishing
        run: npm install -g npm@latest
      - name: publish to npm
        run: |
          # Packages are published in dependency order.
          for package in esbuild-register core loader-core wasi-preview1 cli graphql-loader rollup-plugin jest-transform; do
            echo "::group::publish to npm ($package)"
            pushd "packages/$package"
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
            else
              npm publish --access public --tag "$TAG"
            fi
            popd
            echo "::endgroup::"
          done
        env:
          TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
  deploy-vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_URL: nitrogql.vercel.app
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
